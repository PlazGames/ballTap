<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://iltfozebmhjadqgwmzhg.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_fREc7ax7b7bB2yhJwbJFIQ_1elvxt9v";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const bestText =
    document.getElementById("best");

const comboText =
    document.getElementById("combo");

const statusText =
    document.getElementById("status");

const countdown =
    document.getElementById("countdown");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const pauseScreen =
    document.getElementById("pauseScreen");

const finalScore =
    document.getElementById("finalScore");

const finalBest =
    document.getElementById("finalBest");

const pauseButton =
    document.getElementById("pauseButton");

const playButton =
    document.getElementById("playButton");

const againButton =
    document.getElementById("againButton");

const resumeButton =
    document.getElementById("resumeButton");


const colors = [

    {
        name: "green",
        points: 100
    },

    {
        name: "yellow",
        points: 150
    },

    {
        name: "orange",
        points: 200
    },

    {
        name: "blue",
        points: 300
    },

    {
        name: "red",
        points: 0
    }

];


let obstacles = [];

let running = false;

let paused = false;

let score = 0;

let combo = 0;

let speed = 4;

let spawnTimer = 0;

let difficultyTimer = 0;

let lastTime = 0;

let animationFrame = null;

let audioContext = null;


let bestScore =
    Number(
        localStorage.getItem(
            "ballTapBest"
        ) || 0
    );


bestText.textContent =
    "BEST " + bestScore;


function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


function sound(
    frequency,
    duration,
    type = "sine",
    volume = 0.04
) {

    if (!audioContext) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


function startGame() {

    initAudio();

    cancelAnimationFrame(
        animationFrame
    );

    obstacles.forEach(
        obstacle =>
            obstacle.el.remove()
    );

    obstacles = [];

    score = 0;

    combo = 0;

    speed = 4;

    spawnTimer = 0;

    difficultyTimer = 0;

    running = false;

    paused = false;

    scoreText.textContent =
        "0";

    comboText.textContent =
        "×0";

    startScreen.style.display =
        "none";

    gameOver.style.display =
        "none";

    pauseScreen.style.display =
        "none";

    pauseButton.style.display =
        "block";

    runCountdown();

}


function runCountdown() {

    const numbers =
        ["3", "2", "1", "GO!"];

    let index = 0;

    countdown.style.display =
        "flex";

    function next() {

        countdown.textContent =
            numbers[index];

        countdown.classList.remove(
            "countdownAnimation"
        );

        void countdown.offsetWidth;

        countdown.classList.add(
            "countdownAnimation"
        );

        sound(
            index === 3
                ? 700
                : 450,
            0.12,
            "sine",
            0.03
        );

        index++;

        if (
            index <
            numbers.length
        ) {

            setTimeout(
                next,
                700
            );

        }

        else {

            setTimeout(
                () => {

                    countdown.style.display =
                        "none";

                    running = true;

                    lastTime =
                        performance.now();

                    animationFrame =
                        requestAnimationFrame(
                            gameLoop
                        );

                },
                650
            );

        }

    }

    next();

}


function spawnObstacle() {

    const data =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "obstacle " +
        data.name;

    const startY =
        -70;

    element.style.top =
        startY + "px";

    game.appendChild(
        element
    );

    obstacles.push({

        el: element,

        y: startY,

        color: data,

        clicked: false,

        missed: false

    });

}


function gameLoop(time) {

    if (
        !running ||
        paused
    ) {

        return;

    }

    const delta =
        Math.min(
            (time - lastTime) /
            16.67,
            2
        );

    lastTime =
        time;

    spawnTimer +=
        delta;

    difficultyTimer +=
        delta;

    const spawnDelay =
        Math.max(
            27,
            70 -
            speed * 5
        );

    if (
        spawnTimer >=
        spawnDelay
    ) {

        spawnObstacle();

        spawnTimer = 0;

    }

    if (
        difficultyTimer >=
        300
    ) {

        speed +=
            0.35;

        difficultyTimer =
            0;

    }

    const playerRect =
        player.getBoundingClientRect();

    const playerCenter =
        playerRect.top +
        playerRect.height / 2;

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const obstacle =
            obstacles[i];

        obstacle.y +=
            speed * delta;

        obstacle.el.style.top =
            obstacle.y + "px";

        const rect =
            obstacle.el
                .getBoundingClientRect();

        const center =
            rect.top +
            rect.height / 2;

        if (

            !obstacle.clicked &&

            !obstacle.missed &&

            center >
            playerCenter + 52

        ) {

            obstacle.missed =
                true;

            if (
                obstacle.color.name !==
                "red"
            ) {

                combo = 0;

                comboText.textContent =
                    "×0";

                showStatus(
                    "MISS",
                    "#ff4d4d"
                );

                shake();

                sound(
                    130,
                    0.1,
                    "sawtooth",
                    0.025
                );

            }

        }

        if (
            rect.top >
            window.innerHeight + 100
        ) {

            obstacle.el.remove();

            obstacles.splice(
                i,
                1
            );

        }

    }

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


function handleTap() {

    if (
        !running ||
        paused
    ) {

        return;

    }

    const playerRect =
        player.getBoundingClientRect();

    const playerCenter =
        playerRect.top +
        playerRect.height / 2;

    let closest = null;

    let closestDistance =
        Infinity;

    for (
        const obstacle
        of obstacles
    ) {

        if (
            obstacle.clicked ||
            obstacle.missed
        ) {

            continue;

        }

        const rect =
            obstacle.el
                .getBoundingClientRect();

        const center =
            rect.top +
            rect.height / 2;

        const distance =
            Math.abs(
                center -
                playerCenter
            );

        if (
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closest =
                obstacle;

        }

    }

    if (!closest) {
        return;
    }

    closest.clicked =
        true;

    if (
        closest.color.name ===
        "red"
    ) {

        showStatus(
            "RED!",
            "#ff3030"
        );

        combo = 0;

        comboText.textContent =
            "×0";

        sound(
            90,
            0.25,
            "sawtooth",
            0.06
        );

        shake();

        setTimeout(
            endGame,
            150
        );

        return;

    }

    const distance =
        closestDistance;

    if (
        distance <= 15
    ) {

        combo++;

        const multiplier =
            Math.min(
                1 +
                combo * 0.05,
                3
            );

        const gained =
            Math.round(
                closest.color.points *
                multiplier
            );

        score +=
            gained;

        showStatus(

            combo >= 10

                ? "PERFECT ×" +
                  multiplier.toFixed(1)

                : "PERFECT +" +
                  gained,

            "#ffffff"

        );

        player.classList.remove(
            "playerPerfect"
        );

        void player.offsetWidth;

        player.classList.add(
            "playerPerfect"
        );

        createParticles(
            playerCenter
        );

        sound(
            500 +
            Math.min(
                combo * 15,
                300
            ),
            0.1,
            "sine",
            0.035
        );

    }

    else if (
        distance <= 42
    ) {

        combo++;

        const gained =
            Math.round(
                closest.color.points *
                0.7
            );

        score +=
            gained;

        showStatus(
            "GOOD +" +
            gained,
            "#aaaaaa"
        );

        sound(
            330,
            0.08,
            "sine",
            0.025
        );

    }

    else {

        combo = 0;

        showStatus(
            "MISS",
            "#ff4d4d"
        );

        shake();

        sound(
            120,
            0.1,
            "sawtooth",
            0.025
        );

    }

    scoreText.textContent =
        score;

    comboText.textContent =
        "×" + combo;

    comboText.classList.remove(
        "pop"
    );

    void comboText.offsetWidth;

    comboText.classList.add(
        "pop"
    );

    if (
        score >
        bestScore
    ) {

        bestScore =
            score;

        bestText.textContent =
            "BEST " +
            bestScore;

        localStorage.setItem(
            "ballTapBest",
            bestScore
        );

    }

    closest.el.remove();

    const index =
        obstacles.indexOf(
            closest
        );

    if (
        index !== -1
    ) {

        obstacles.splice(
            index,
            1
        );

    }

}


function createParticles(y) {

    const rect =
        player.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        y;

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            centerX + "px";

        particle.style.top =
            centerY + "px";

        particle.style.background =
            Math.random() > 0.35
                ? "white"
                : "#ff5363";

        game.appendChild(
            particle
        );

        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            35 +
            Math.random() *
            45;

        const targetX =
            Math.cos(angle) *
            distance;

        const targetY =
            Math.sin(angle) *
            distance;

        particle.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(1)",

                    opacity: 1
                },

                {
                    transform:
                        "translate(" +
                        targetX +
                        "px," +
                        targetY +
                        "px) scale(0)",

                    opacity: 0
                }

            ],

            {

                duration:
                    350 +
                    Math.random() *
                    250,

                easing:
                    "cubic-bezier(.2,.8,.3,1)"

            }

        ).onfinish =
            () =>
                particle.remove();

    }

}


function showStatus(
    text,
    color
) {

    statusText.textContent =
        text;

    statusText.style.color =
        color;

    statusText.classList.remove(
        "statusShow"
    );

    void statusText.offsetWidth;

    statusText.classList.add(
        "statusShow"
    );

}


function shake() {

    game.classList.remove(
        "shake"
    );

    void game.offsetWidth;

    game.classList.add(
        "shake"
    );

}


function togglePause() {

    if (!running) {
        return;
    }

    paused =
        !paused;

    if (paused) {

        pauseScreen.style.display =
            "flex";

        pauseButton.textContent =
            "▶";

    }

    else {

        pauseScreen.style.display =
            "none";

        pauseButton.textContent =
            "II";

        lastTime =
            performance.now();

        animationFrame =
            requestAnimationFrame(
                gameLoop
            );

    }

}


async function submitScore(finalScoreValue) {

    if (
        finalScoreValue <= 0
    ) {

        return;

    }

    let username =
        localStorage.getItem(
            "ballTapUsername"
        );

    if (!username) {

        username =
            prompt(
                "Enter your name for the ballTap leaderboard:"
            );

        if (!username) {

            username =
                "Anonymous";

        }

        username =
            username
                .trim()
                .slice(0, 20);

        if (!username) {

            username =
                "Anonymous";

        }

        localStorage.setItem(
            "ballTapUsername",
            username
        );

    }

    const {
        error
    } =
        await supabaseClient
            .from("leaderboard")
            .insert({

                username:
                    username,

                score:
                    finalScoreValue

            });

    if (error) {

        console.error(
            "Leaderboard upload failed:",
            error
        );

    }

}


function endGame() {

    if (!running) {
        return;
    }

    running = false;

    paused = false;

    cancelAnimationFrame(
        animationFrame
    );

    obstacles.forEach(
        obstacle =>
            obstacle.el.remove()
    );

    obstacles = [];

    if (
        score >
        bestScore
    ) {

        bestScore =
            score;

        localStorage.setItem(
            "ballTapBest",
            bestScore
        );

    }

    finalScore.textContent =
        "Score " +
        score;

    finalBest.textContent =
        "Best " +
        bestScore;

    gameOver.style.display =
        "flex";

    pauseButton.style.display =
        "none";

    submitScore(score);

}


playButton.addEventListener(
    "click",
    startGame
);


againButton.addEventListener(
    "click",
    startGame
);


resumeButton.addEventListener(
    "click",
    togglePause
);


pauseButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        togglePause();

    }
);


document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target.closest(
                "button"
            )
        ) {

            return;

        }

        handleTap();

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ) {

            event.preventDefault();

            handleTap();

        }

        if (
            event.code === "Escape"
        ) {

            togglePause();

        }

    }
);

</script>
