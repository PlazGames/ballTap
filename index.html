<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ballTap</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080304;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    touch-action: manipulation;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #321015 0%,
            #18090d 32%,
            #090305 65%,
            #030203 100%
        );

    color: white;
}

#game::before {
    content: "";

    position: absolute;
    inset: -50%;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 70px,
            rgba(255,80,90,0.018) 71px,
            transparent 72px
        );

    transform: rotate(12deg);

    animation:
        backgroundMove 18s linear infinite;

    pointer-events: none;
}

#game::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 50%,
            transparent 0%,
            rgba(120,0,20,0.04) 45%,
            rgba(0,0,0,0.45) 100%
        );

    pointer-events: none;
}

@keyframes backgroundMove {

    from {
        transform:
            rotate(12deg)
            translateY(0);
    }

    to {
        transform:
            rotate(12deg)
            translateY(180px);
    }

}

#game.shake {
    animation: screenShake 0.2s linear;
}

@keyframes screenShake {

    0% {
        transform: translate(0, 0);
    }

    20% {
        transform: translate(7px, -5px);
    }

    40% {
        transform: translate(-6px, 5px);
    }

    60% {
        transform: translate(5px, 3px);
    }

    80% {
        transform: translate(-3px, -3px);
    }

    100% {
        transform: translate(0, 0);
    }

}

#lane {

    position: absolute;

    left: 50%;
    top: 0;
    bottom: 0;

    width: 210px;

    transform:
        translateX(-50%);

    border-left:
        1px solid
        rgba(255,80,90,0.06);

    border-right:
        1px solid
        rgba(255,80,90,0.06);

    pointer-events: none;
}

#lane::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 1px;
    height: 100%;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,70,80,0.16),
            transparent
        );

}

#topBar {

    position: absolute;

    top: 20px;
    left: 20px;
    right: 20px;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    z-index: 50;

    pointer-events: none;

}

#brand {

    font-size: 22px;

    font-weight: 1000;

    letter-spacing: -1px;

    color: white;

    text-shadow:
        0 0 20px
        rgba(255,50,70,0.25);

}

#brand span {

    color: #ff5363;

}

#stats {

    text-align: right;

}

#score {

    font-size: 34px;

    line-height: 1;

    font-weight: 1000;

    color: white;

    text-shadow:
        0 0 18px
        rgba(255,60,80,0.3);

}

#best {

    margin-top: 6px;

    color: #8b686d;

    font-size: 12px;

    font-weight: 800;

}

#comboBox {

    position: absolute;

    top: 100px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    text-align: center;

    pointer-events: none;

}

#comboLabel {

    color: #8b5b61;

    font-size: 10px;

    letter-spacing: 2px;

    font-weight: 900;

}

#combo {

    margin-top: 3px;

    font-size: 28px;

    font-weight: 1000;

    color: white;

    text-shadow:
        0 0 18px
        rgba(255,60,80,0.35);

    transition:
        transform 0.12s ease;

}

#combo.pop {

    transform:
        scale(1.3);

}

#pauseButton {

    position: absolute;

    right: 20px;
    bottom: 20px;

    z-index: 70;

    width: 44px;
    height: 44px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,90,100,0.18);

    background:
        rgba(255,60,80,0.08);

    color: white;

    font-size: 17px;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 0 20px
        rgba(255,40,60,0.08);

}

#pauseButton:hover {

    background:
        rgba(255,60,80,0.18);

}

#player {

    position: absolute;

    left: 50%;

    bottom: 90px;

    width: 54px;
    height: 54px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #eeeeee 12%,
            #54151d 16%,
            #18070b 58%,
            #090205 100%
        );

    border:
        2px solid
        rgba(255,255,255,0.95);

    box-shadow:
        0 0 12px
        rgba(255,255,255,0.8),

        0 0 32px
        rgba(255,50,70,0.35),

        0 0 70px
        rgba(255,30,50,0.12);

    z-index: 30;

}

#player::before {

    content: "";

    position: absolute;

    inset: -10px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,70,85,0.18);

    box-shadow:
        0 0 20px
        rgba(255,40,60,0.08);

}

#player::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 13px;
    height: 13px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 15px white,
        0 0 30px
        rgba(255,80,90,0.65);

}

.playerPerfect {

    animation:
        playerPerfect 0.2s ease-out;

}

@keyframes playerPerfect {

    0% {

        transform:
            translateX(-50%)
            scale(1);

    }

    50% {

        transform:
            translateX(-50%)
            scale(1.35);

        box-shadow:
            0 0 25px white,
            0 0 55px
            rgba(255,60,80,0.75),
            0 0 90px
            rgba(255,30,50,0.3);

    }

    100% {

        transform:
            translateX(-50%)
            scale(1);

    }

}

.obstacle {

    position: absolute;

    left: 50%;

    width: 46px;
    height: 46px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    pointer-events: none;

    z-index: 20;

}

.obstacle::after {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.18);

}

.green {

    background: #32ed87;

    box-shadow:
        0 0 12px #32ed87,
        0 0 35px
        rgba(50,237,135,0.55),
        0 0 70px
        rgba(50,237,135,0.18);

}

.yellow {

    background: #ffe34d;

    box-shadow:
        0 0 12px #ffe34d,
        0 0 35px
        rgba(255,227,77,0.55),
        0 0 70px
        rgba(255,227,77,0.18);

}

.orange {

    background: #ff861e;

    box-shadow:
        0 0 12px #ff861e,
        0 0 35px
        rgba(255,134,30,0.55),
        0 0 70px
        rgba(255,134,30,0.18);

}

.blue {

    background: #20cfff;

    box-shadow:
        0 0 12px #20cfff,
        0 0 35px
        rgba(32,207,255,0.6),
        0 0 70px
        rgba(32,207,255,0.2);

}

.red {

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff7a7a,
            #ff3038 35%,
            #a40018 100%
        );

    box-shadow:
        0 0 15px #ff3038,
        0 0 40px
        rgba(255,40,55,0.7),
        0 0 80px
        rgba(255,20,40,0.3);

    animation:
        redPulse
        0.7s ease-in-out
        infinite alternate;

}

@keyframes redPulse {

    from {

        transform:
            translateX(-50%)
            scale(0.94);

    }

    to {

        transform:
            translateX(-50%)
            scale(1.08);

    }

}

#status {

    position: absolute;

    left: 50%;
    top: 43%;

    transform:
        translate(-50%,-50%);

    z-index: 80;

    font-size: 31px;

    font-weight: 1000;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    text-shadow:
        0 4px 25px
        rgba(0,0,0,0.8);

}

.statusShow {

    animation:
        statusAnimation
        0.6s ease-out;

}

@keyframes statusAnimation {

    0% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(0.65);

    }

    18% {

        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1.15);

    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-80%)
            scale(1);

    }

}

.particle {

    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 90;

}

#bottomInfo {

    position: absolute;

    bottom: 22px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 40;

    text-align: center;

    color: #704c51;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;

    pointer-events: none;

}

#startScreen,
#gameOver,
#pauseScreen {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(55,12,20,0.97),
            rgba(12,3,6,0.985)
        );

}

#gameOver,
#pauseScreen {

    display: none;

}

.logo {

    font-size:
        clamp(58px, 12vw, 105px);

    line-height: 0.9;

    font-weight: 1000;

    letter-spacing: -6px;

    color: white;

    text-shadow:
        0 0 25px
        rgba(255,60,80,0.18);

}

.logo span {

    color: #ff5363;

}

.tagline {

    margin-top: 18px;

    color: #9b7479;

    font-size: 14px;

    line-height: 1.6;

    font-weight: 700;

}

.primaryButton {

    margin-top: 30px;

    min-width: 150px;

    padding: 15px 30px;

    border:
        1px solid
        rgba(255,100,110,0.35);

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ff5363,
            #b8172d
        );

    color: white;

    font-size: 16px;

    font-weight: 1000;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    box-shadow:
        0 8px 30px
        rgba(220,30,55,0.22);

}

.primaryButton:hover {

    transform:
        translateY(-2px)
        scale(1.04);

    box-shadow:
        0 10px 40px
        rgba(255,50,70,0.35);

}

.primaryButton:active {

    transform:
        scale(0.96);

}

.secondaryText {

    margin-top: 17px;

    color: #6f4d52;

    font-size: 11px;

    font-weight: 700;

}

.logo {

    animation: logoFloat 3s ease-in-out infinite;

}

@keyframes logoFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}

#countdown {

    position: absolute;

    inset: 0;

    z-index: 150;

    display: none;

    align-items: center;

    justify-content: center;

    font-size: 100px;

    font-weight: 1000;

    color: white;

    pointer-events: none;

    text-shadow:
        0 0 35px
        rgba(255,50,70,0.45);

}

.countdownAnimation {

    animation:
        countdownPop
        0.75s ease-out;

}

@keyframes countdownPop {

    0% {

        opacity: 0;

        transform:
            scale(1.7);

    }

    30% {

        opacity: 1;

        transform:
            scale(1);

    }

    100% {

        opacity: 0;

        transform:
            scale(0.75);

    }

}

#finalScore {

    margin-top: 20px;

    font-size: 27px;

    font-weight: 900;

    color: white;

    text-shadow:
        0 0 20px
        rgba(255,50,70,0.2);

}

#finalBest {

    margin-top: 7px;

    font-size: 13px;

    color: #8b686d;

    font-weight: 700;

}

@media(max-width:600px) {

    #lane {
        width: 140px;
    }

    #player {

        width: 50px;
        height: 50px;

        bottom: 75px;

    }

    .obstacle {

        width: 42px;
        height: 42px;

    }

    #comboBox {
        top: 90px;
    }

    #score {
        font-size: 28px;
    }

    #brand {
        font-size: 19px;
    }

    #bottomInfo {

        bottom: 20px;

        font-size: 8px;

    }

}

</style>

</head>

<body>

<div id="game">

    <div id="lane"></div>

    <div id="topBar">

        <div id="brand">
            ball<span>Tap</span>
        </div>

        <div id="stats">

            <div id="score">
                0
            </div>

            <div id="best">
                BEST 0
            </div>

        </div>

    </div>

    <div id="comboBox">

        <div id="comboLabel">
            COMBO
        </div>

        <div id="combo">
            ×0
        </div>

    </div>

    <div id="status"></div>

    <div id="countdown"></div>

    <div id="player"></div>

    <div id="bottomInfo">
        TAP ANYWHERE • CLICK ANYWHERE • SPACE / W / ↑
    </div>

    <button
        id="pauseButton"
        style="display:none"
    >
        II
    </button>

    <div id="startScreen">

        <div class="logo">
            ball<span>Tap</span>
        </div>

        <div class="tagline">

            Test your reflexes.<br>

            Tap the colors. Avoid red.

        </div>

        <button
            class="primaryButton"
            id="playButton"
        >
            PLAY
        </button>

        <div class="secondaryText">
            Tap anywhere when a ball reaches you
        </div>

    </div>

    <div id="gameOver">

        <div class="logo">
            ball<span>Tap</span>
        </div>

        <div id="finalScore">
            Score 0
        </div>

        <div id="finalBest">
            Best 0
        </div>

        <button
            class="primaryButton"
            id="againButton"
        >
            PLAY AGAIN
        </button>

    </div>

    <div id="pauseScreen">

        <div class="logo">
            PAUSED
        </div>

        <div class="tagline">
            Take a breath 😎
        </div>

        <button
            class="primaryButton"
            id="resumeButton"
        >
            RESUME
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://iltfozebmhjadqgwmzhg.supabase.co/rest/v1/";

const SUPABASE_KEY = "sb_publishable_fREc7ax7b7bB2yhJwbJFIQ_1elvxt9v";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const bestText =
    document.getElementById("best");

const comboText =
    document.getElementById("combo");

const statusText =
    document.getElementById("status");

const countdown =
    document.getElementById("countdown");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const pauseScreen =
    document.getElementById("pauseScreen");

const finalScore =
    document.getElementById("finalScore");

const finalBest =
    document.getElementById("finalBest");

const pauseButton =
    document.getElementById("pauseButton");

const playButton =
    document.getElementById("playButton");

const againButton =
    document.getElementById("againButton");

const resumeButton =
    document.getElementById("resumeButton");


const colors = [

    {
        name: "green",
        points: 100
    },

    {
        name: "yellow",
        points: 150
    },

    {
        name: "orange",
        points: 200
    },

    {
        name: "blue",
        points: 300
    },

    {
        name: "red",
        points: 0
    }

];


let obstacles = [];

let running = false;

let paused = false;

let score = 0;

let combo = 0;

let speed = 4;

let spawnTimer = 0;

let difficultyTimer = 0;

let lastTime = 0;

let animationFrame = null;

let audioContext = null;


let bestScore =
    Number(
        localStorage.getItem(
            "ballTapBest"
        ) || 0
    );


bestText.textContent =
    "BEST " + bestScore;


function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


function sound(
    frequency,
    duration,
    type = "sine",
    volume = 0.04
) {

    if (!audioContext) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


function startGame() {

    initAudio();

    cancelAnimationFrame(
        animationFrame
    );

    obstacles.forEach(
        obstacle =>
            obstacle.el.remove()
    );

    obstacles = [];

    score = 0;

    combo = 0;

    speed = 4;

    spawnTimer = 0;

    difficultyTimer = 0;

    running = false;

    paused = false;

    scoreText.textContent =
        "0";

    comboText.textContent =
        "×0";

    startScreen.style.display =
        "none";

    gameOver.style.display =
        "none";

    pauseScreen.style.display =
        "none";

    pauseButton.style.display =
        "block";

    runCountdown();

}


function runCountdown() {

    const numbers =
        ["3", "2", "1", "GO!"];

    let index = 0;

    countdown.style.display =
        "flex";

    function next() {

        countdown.textContent =
            numbers[index];

        countdown.classList.remove(
            "countdownAnimation"
        );

        void countdown.offsetWidth;

        countdown.classList.add(
            "countdownAnimation"
        );

        sound(
            index === 3
                ? 700
                : 450,
            0.12,
            "sine",
            0.03
        );

        index++;

        if (
            index <
            numbers.length
        ) {

            setTimeout(
                next,
                700
            );

        }

        else {

            setTimeout(
                () => {

                    countdown.style.display =
                        "none";

                    running = true;

                    lastTime =
                        performance.now();

                    animationFrame =
                        requestAnimationFrame(
                            gameLoop
                        );

                },
                650
            );

        }

    }

    next();

}


function spawnObstacle() {

    const data =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "obstacle " +
        data.name;

    const startY =
        -70;

    element.style.top =
        startY + "px";

    game.appendChild(
        element
    );

    obstacles.push({

        el: element,

        y: startY,

        color: data,

        clicked: false,

        missed: false

    });

}


function gameLoop(time) {

    if (
        !running ||
        paused
    ) {

        return;

    }

    const delta =
        Math.min(
            (time - lastTime) /
            16.67,
            2
        );

    lastTime =
        time;

    spawnTimer +=
        delta;

    difficultyTimer +=
        delta;

    const spawnDelay =
        Math.max(
            27,
            70 -
            speed * 5
        );

    if (
        spawnTimer >=
        spawnDelay
    ) {

        spawnObstacle();

        spawnTimer = 0;

    }

    if (
        difficultyTimer >=
        300
    ) {

        speed +=
            0.35;

        difficultyTimer =
            0;

    }

    const playerRect =
        player.getBoundingClientRect();

    const playerCenter =
        playerRect.top +
        playerRect.height / 2;

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const obstacle =
            obstacles[i];

        obstacle.y +=
            speed * delta;

        obstacle.el.style.top =
            obstacle.y + "px";

        const rect =
            obstacle.el
                .getBoundingClientRect();

        const center =
            rect.top +
            rect.height / 2;

        if (

            !obstacle.clicked &&

            !obstacle.missed &&

            center >
            playerCenter + 52

        ) {

            obstacle.missed =
                true;

            if (
                obstacle.color.name !==
                "red"
            ) {

                combo = 0;

                comboText.textContent =
                    "×0";

                showStatus(
                    "MISS",
                    "#ff4d4d"
                );

                shake();

                sound(
                    130,
                    0.1,
                    "sawtooth",
                    0.025
                );

            }

        }

        if (
            rect.top >
            window.innerHeight + 100
        ) {

            obstacle.el.remove();

            obstacles.splice(
                i,
                1
            );

        }

    }

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


function handleTap() {

    if (
        !running ||
        paused
    ) {

        return;

    }

    const playerRect =
        player.getBoundingClientRect();

    const playerCenter =
        playerRect.top +
        playerRect.height / 2;

    let closest = null;

    let closestDistance =
        Infinity;

    for (
        const obstacle
        of obstacles
    ) {

        if (
            obstacle.clicked ||
            obstacle.missed
        ) {

            continue;

        }

        const rect =
            obstacle.el
                .getBoundingClientRect();

        const center =
            rect.top +
            rect.height / 2;

        const distance =
            Math.abs(
                center -
                playerCenter
            );

        if (
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closest =
                obstacle;

        }

    }

    if (!closest) {
        return;
    }

    closest.clicked =
        true;

    if (
        closest.color.name ===
        "red"
    ) {

        showStatus(
            "RED!",
            "#ff3030"
        );

        combo = 0;

        comboText.textContent =
            "×0";

        sound(
            90,
            0.25,
            "sawtooth",
            0.06
        );

        shake();

        setTimeout(
            endGame,
            150
        );

        return;

    }

    const distance =
        closestDistance;

    if (
        distance <= 15
    ) {

        combo++;

        const multiplier =
            Math.min(
                1 +
                combo * 0.05,
                3
            );

        const gained =
            Math.round(
                closest.color.points *
                multiplier
            );

        score +=
            gained;

        showStatus(

            combo >= 10

                ? "PERFECT ×" +
                  multiplier.toFixed(1)

                : "PERFECT +" +
                  gained,

            "#ffffff"

        );

        player.classList.remove(
            "playerPerfect"
        );

        void player.offsetWidth;

        player.classList.add(
            "playerPerfect"
        );

        createParticles(
            playerCenter
        );

        sound(
            500 +
            Math.min(
                combo * 15,
                300
            ),
            0.1,
            "sine",
            0.035
        );

    }

    else if (
        distance <= 42
    ) {

        combo++;

        const gained =
            Math.round(
                closest.color.points *
                0.7
            );

        score +=
            gained;

        showStatus(
            "GOOD +" +
            gained,
            "#aaaaaa"
        );

        sound(
            330,
            0.08,
            "sine",
            0.025
        );

    }

    else {

        combo = 0;

        showStatus(
            "MISS",
            "#ff4d4d"
        );

        shake();

        sound(
            120,
            0.1,
            "sawtooth",
            0.025
        );

    }

    scoreText.textContent =
        score;

    comboText.textContent =
        "×" + combo;

    comboText.classList.remove(
        "pop"
    );

    void comboText.offsetWidth;

    comboText.classList.add(
        "pop"
    );

    if (
        score >
        bestScore
    ) {

        bestScore =
            score;

        bestText.textContent =
            "BEST " +
            bestScore;

        localStorage.setItem(
            "ballTapBest",
            bestScore
        );

    }

    closest.el.remove();

    const index =
        obstacles.indexOf(
            closest
        );

    if (
        index !== -1
    ) {

        obstacles.splice(
            index,
            1
        );

    }

}


function createParticles(y) {

    const rect =
        player.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        y;

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            centerX + "px";

        particle.style.top =
            centerY + "px";

        particle.style.background =
            Math.random() > 0.35
                ? "white"
                : "#ff5363";

        game.appendChild(
            particle
        );

        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            35 +
            Math.random() *
            45;

        const targetX =
            Math.cos(angle) *
            distance;

        const targetY =
            Math.sin(angle) *
            distance;

        particle.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(1)",

                    opacity: 1
                },

                {
                    transform:
                        "translate(" +
                        targetX +
                        "px," +
                        targetY +
                        "px) scale(0)",

                    opacity: 0
                }

            ],

            {

                duration:
                    350 +
                    Math.random() *
                    250,

                easing:
                    "cubic-bezier(.2,.8,.3,1)"

            }

        ).onfinish =
            () =>
                particle.remove();

    }

}


function showStatus(
    text,
    color
) {

    statusText.textContent =
        text;

    statusText.style.color =
        color;

    statusText.classList.remove(
        "statusShow"
    );

    void statusText.offsetWidth;

    statusText.classList.add(
        "statusShow"
    );

}


function shake() {

    game.classList.remove(
        "shake"
    );

    void game.offsetWidth;

    game.classList.add(
        "shake"
    );

}


function togglePause() {

    if (!running) {
        return;
    }

    paused =
        !paused;

    if (paused) {

        pauseScreen.style.display =
            "flex";

        pauseButton.textContent =
            "▶";

    }

    else {

        pauseScreen.style.display =
            "none";

        pauseButton.textContent =
            "II";

        lastTime =
            performance.now();

        animationFrame =
            requestAnimationFrame(
                gameLoop
            );

    }

}


async function submitScore(
    finalScoreValue
) {

    if (
        finalScoreValue <= 0
    ) {

        return;

    }

    let username =
        localStorage.getItem(
            "ballTapUsername"
        );

    if (!username) {

        username =
            prompt(
                "Enter your name for the ballTap leaderboard:"
            );

        if (!username) {

            username =
                "Anonymous";

        }

        username =
            username
                .trim()
                .slice(0, 20);

        if (!username) {

            username =
                "Anonymous";

        }

        localStorage.setItem(
            "ballTapUsername",
            username
        );

    }

    try {

        const {
            error
        } =
            await supabaseClient
                .from("leaderboard")
                .insert({

                    username:
                        username,

                    score:
                        finalScoreValue

                });

        if (error) {

            console.error(
                "Leaderboard upload failed:",
                error
            );

        }

    }

    catch (error) {

        console.error(
            "Supabase connection failed:",
            error
        );

    }

}


function endGame() {

    if (!running) {
        return;
    }

    running = false;

    paused = false;

    cancelAnimationFrame(
        animationFrame
    );

    obstacles.forEach(
        obstacle =>
            obstacle.el.remove()
    );

    obstacles = [];

    if (
        score >
        bestScore
    ) {

        bestScore =
            score;

        localStorage.setItem(
            "ballTapBest",
            bestScore
        );

    }

    finalScore.textContent =
        "Score " +
        score;

    finalBest.textContent =
        "Best " +
        bestScore;

    gameOver.style.display =
        "flex";

    pauseButton.style.display =
        "none";

    submitScore(score);

}


playButton.addEventListener(
    "click",
    startGame
);


againButton.addEventListener(
    "click",
    startGame
);


resumeButton.addEventListener(
    "click",
    togglePause
);


pauseButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        togglePause();

    }
);


document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target.closest(
                "button"
            )
        ) {

            return;

        }

        handleTap();

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ) {

            event.preventDefault();

            handleTap();

        }

        if (
            event.code === "Escape"
        ) {

            togglePause();

        }

    }
);

</script>
